services:
  init:
    build: .
    image: questionbox:local
    env_file: .env
    command: ["python", "manage.py", "migrate", "--noinput"]
    volumes: ["questionbox-data:/app/data"]
    networks: [questionbox]
    restart: "no"
  web:
    build: .
    image: questionbox:local
    env_file: .env
    ports: ["127.0.0.1:${WEB_PORT:-8000}:8000"]
    volumes: ["questionbox-data:/app/data"]
    depends_on:
      init:
        condition: service_completed_successfully
    networks: [questionbox]
    restart: unless-stopped
  worker:
    image: questionbox:local
    env_file: .env
    command: ["python", "manage.py", "mail_worker"]
    volumes: ["questionbox-data:/app/data"]
    depends_on:
      init:
        condition: service_completed_successfully
    networks: [questionbox]
    restart: unless-stopped
volumes:
  questionbox-data:
networks:
  questionbox:
